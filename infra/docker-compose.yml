services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aiplatform
      POSTGRES_USER: aiplatform
      POSTGRES_PASSWORD: change-me-local
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiplatform -d aiplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: infra/app.Dockerfile
    environment:
      AIPLATFORM_DB_URL: postgresql+psycopg://aiplatform:change-me-local@postgres:5432/aiplatform
      AIPLATFORM_WORKSPACES: /srv/.workspaces
    volumes:
      - ../.workspaces:/srv/.workspaces
    ports:
      - "7701:7700"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:7700/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
